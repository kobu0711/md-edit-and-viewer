services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: md-edit-and-viewer:latest
    container_name: md-edit-and-viewer-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
